<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>logo dalmatyńczyk — podgląd</title>
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; }
  section { padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  video { width: min(90vw, 1100px); height: auto; }
  .label { font-size: 12px; opacity: .6; letter-spacing: .08em; text-transform: uppercase; }
  .black  { background: #000; color: #fff; }
  .cream  { background: #F8F9F2; color: #000; }
  .yellow { background: #FFCC33; color: #000; }
  .blue   { background: #0522FF; color: #fff; }
</style>
</head>
<body>
<section class="black"><span class="label">czerń</span>
  <video autoplay loop muted playsinline preload="auto">
    <source src="logo-dalmatian.mp4" type='video/mp4;codecs=hvc1'>
    <source src="logo-dalmatian.webm" type="video/webm">
  </video>
</section>
<section class="cream"><span class="label">krem F8F9F2</span>
  <video autoplay loop muted playsinline preload="auto">
    <source src="logo-dalmatian.mp4" type='video/mp4;codecs=hvc1'>
    <source src="logo-dalmatian.webm" type="video/webm">
  </video>
</section>
<section class="yellow"><span class="label">żółty FFCC33</span>
  <video autoplay loop muted playsinline preload="auto">
    <source src="logo-dalmatian.mp4" type='video/mp4;codecs=hvc1'>
    <source src="logo-dalmatian.webm" type="video/webm">
  </video>
</section>
<section class="blue"><span class="label">niebieski 0522FF</span>
  <video autoplay loop muted playsinline preload="auto">
    <source src="logo-dalmatian.mp4" type='video/mp4;codecs=hvc1'>
    <source src="logo-dalmatian.webm" type="video/webm">
  </video>
</section>
</body>
</html>
